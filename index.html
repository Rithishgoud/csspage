
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopNow - Responsive Navbar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <nav class="navbar">

            <!-- Logo -->
            <a href="#" class="logo">
                ShopNow
            </a>

            <!-- Navigation links -->
            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#">Products</a>
                </li>

                <li>
                    <a href="#">Categories</a>
                </li>

                <li>
                    <a href="#">About</a>
                </li>

            </ul>
                <div>            <!-- Search bar -->
            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search products..."
                    aria-label="Search products"
                >

                <button type="button">
                    Search
                </button>

            </div>
          
            </div>
            

            <!-- User actions -->
            <div class="nav-actions">

                <a href="#" class="login-btn">
                    Login
                </a>

                <a href="#" class="cart-btn">
                    Cart (0)
                </a>

            </div>

            <!-- Mobile hamburger button -->
            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navLinks"
            >
                ☰
            </button>

        </nav>

    </header>

    <script src="script.js"></script>

</body>
</html>
